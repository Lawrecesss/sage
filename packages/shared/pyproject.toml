[project]
name = "sage-shared"
version = "0.0.0"
description = "Cross-package types, settings and constants for Sage"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_shared"]
