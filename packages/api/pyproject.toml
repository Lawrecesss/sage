[project]
name = "sage-api"
version = "0.0.0"
description = "FastAPI service (uvicorn, containerised)"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sage-warehouse",
  "sage-agents",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_api"]
