[project]
name = "sage-mcp"
version = "0.0.0"
description = "MCP server — Sage's governed tool surface, served to OpenClaw"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sage-warehouse",
  "mcp[cli]>=1.2",
  "pydantic>=2.7",
]

[project.scripts]
sage-mcp = "sage_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_mcp"]
