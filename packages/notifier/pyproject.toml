[project]
name = "sage-notifier"
version = "0.0.0"
description = "Pushes the morning brief to Telegram (primary) / SES"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "httpx>=0.27",
  "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_notifier"]
