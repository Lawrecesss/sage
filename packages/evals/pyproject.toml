[project]
name = "sage-evals"
version = "0.0.0"
description = "Agent eval harness — replays the pipeline and prints the headline number"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sage-generator",
  "sage-warehouse",
  "sage-detectors",
  "sage-agents",
  "rich>=13.0",
]

[project.scripts]
sage-evals = "sage_evals.harness:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_evals"]
