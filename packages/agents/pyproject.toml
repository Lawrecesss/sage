[project]
name = "sage-agents"
version = "0.0.0"
description = "Strands agents, tool surface, prompts, Bedrock integration"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sage-warehouse",
  "strands-agents>=1.0",
  "anthropic[bedrock]>=0.40",
  "boto3>=1.35",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_agents"]
