[project]
name = "sage-agents"
version = "0.0.0"
description = "Strands agents, tool surface, prompts, LLM integration"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sage-warehouse",
  "strands-agents[ollama]>=1.0",
  "pydantic>=2.7",
]

[project.scripts]
sage-worker = "sage_agents.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_agents"]
