[project]
name = "sage-cron-monitor"
version = "0.0.0"
description = "Runs the anomaly-monitor report on a fixed schedule for every active tenant"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  # Debian slim images don't ship the IANA tz database; this pure-Python copy makes
  # zoneinfo.ZoneInfo("Asia/Singapore") work without relying on the host's tzdata.
  "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_cron_monitor"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
