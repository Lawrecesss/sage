[project]
name = "sage-notifier"
version = "0.0.0"
description = "Pushes the morning brief to Telegram"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_notifier"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]
