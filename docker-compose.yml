# Base compose file — used directly for local dev (`docker compose up -d db`),
# and as the base layer for the production deploy:
#   docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sage}
      POSTGRES_DB: sage
    ports:
      - "127.0.0.1:5432:5432"   # localhost only; prod never exposes it
    volumes:
      - sage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: agent trace UI. `docker compose up -d jaeger` and point
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 at it.
  # jaeger:
  #   image: jaegertracing/all-in-one:1.60
  #   ports: ["16686:16686", "4318:4318"]

volumes:
  sage_pgdata:
