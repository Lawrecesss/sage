# Root compose file wiring every microservice. Each service builds from its own
# folder (own Dockerfile + own lockfile — no shared workspace). Most services are
# still skeletons (entity models only); their default command is a placeholder.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sage}
      POSTGRES_DB: sage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: ./mcp
    environment:
      DATABASE_URL: postgresql+psycopg://sage:${POSTGRES_PASSWORD:-sage}@db:5432/sage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  openclaw:
    build: ./openclaw
    environment:
      MCP_URL: http://mcp:9100/mcp
    depends_on:
      - mcp
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mcp
    restart: unless-stopped

  generator:
    build: ./data/generator
    profiles: ["jobs"]

  warehouse:
    build: ./data/warehouse
    environment:
      DATABASE_URL: postgresql+psycopg://sage:${POSTGRES_PASSWORD:-sage}@db:5432/sage
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]

  detectors:
    build: ./data/detectors
    profiles: ["jobs"]

  evals:
    build: ./data/evals
    profiles: ["jobs"]

  notifier:
    build: ./platform/notifier
    profiles: ["jobs"]

volumes:
  sage_pgdata:
