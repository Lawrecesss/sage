name: Deploy

on:
  workflow_dispatch:

# Redeploy the Lightsail instance: SSH in, pull, rebuild, restart the stack.
# STUB — set the SAGE_SSH_KEY and SAGE_HOST secrets first.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        run: |
          echo "STUB — wire up once secrets exist:"
          echo '  install -m600 <(echo "$SAGE_SSH_KEY") key'
          echo '  ssh -i key ubuntu@$SAGE_HOST "cd /opt/sage \
                   && git pull --ff-only \
                   && docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d --build"'
        env:
          SAGE_SSH_KEY: ${{ secrets.SAGE_SSH_KEY }}
          SAGE_HOST: ${{ secrets.SAGE_HOST }}
