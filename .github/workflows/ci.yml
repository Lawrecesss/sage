name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Work out what to test from the PR's labels (see .github/labeler.yml,
  # which is the source of truth for what each label covers).
  #
  # The Labeler workflow (pull_request_target) and this one (pull_request)
  # both fire on `opened`, so a run can start here before labels have
  # landed. We don't special-case that: it just resolves to "no labels yet"
  # and tests get skipped. The `labeled`/`unlabeled` trigger above then
  # fires a fresh run once the Labeler workflow applies them, and the
  # concurrency group cancels the stale run — so the check that ends up
  # counting is always the one with the right labels.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.map.outputs.web }}
      agent: ${{ steps.map.outputs.agent }}
      lint_python: ${{ steps.map.outputs.lint_python }}
      packages: ${{ steps.map.outputs.packages }}
    steps:
      - name: Read PR labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            labels=$(gh pr view "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --json labels -q '[.labels[].name] | join(",")')
          else
            # Push to main (post-merge): no PR/labels to key off — test everything.
            labels="__all__"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "Labels: $labels"

      # Label -> test target mapping. Keep label names in sync with
      # .github/labeler.yml.
      - id: map
        env:
          LABELS: ",${{ steps.labels.outputs.labels }},"
        run: |
          set -euo pipefail
          has() { [[ "$LABELS" == *",$1,"* ]]; }

          if [ "$LABELS" = ",__all__," ]; then
            web=true
            agent=true
            lint_python=true
            packages='["warehouse","generator","detectors","mcp","evals","api","notifier","shared"]'
          else
            web=false
            agent=false
            pkgs=()

            has "data/metrics" && pkgs+=(warehouse generator)
            has "detectors"    && pkgs+=(detectors)
            has "agent"        && { pkgs+=(mcp evals); agent=true; }
            has "backend"      && pkgs+=(api)
            has "notifier"     && pkgs+=(notifier)
            has "frontend"     && web=true

            # Shared code or a dependency bump can affect every package.
            if has "shared" || has "deps"; then
              pkgs=(warehouse generator detectors mcp evals api notifier shared)
              agent=true
              web=true
            fi

            if [ "${#pkgs[@]}" -gt 0 ]; then
              lint_python=true
              packages=$(printf '%s\n' "${pkgs[@]}" | sort -u | jq -R . | jq -sc .)
            else
              lint_python=false
              packages='[]'
            fi
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "lint_python=$lint_python" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Resolved: web=$web agent=$agent lint_python=$lint_python packages=$packages"

  lint-python:
    needs: changes
    if: needs.changes.outputs.lint_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-python:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: sage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sage" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sage:sage@localhost:5432/sage
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest packages/${{ matrix.package }}

  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # Runs when the "agent" label is set — see docs/eval-plan.md.
  eval:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Run the agent eval harness
        run: |
          if uv run sage-evals --help >/dev/null 2>&1; then
            uv run sage-evals
          else
            echo "::notice::sage-evals not implemented yet — skipping (docs/eval-plan.md)"
          fi

  # Single required check for branch protection: green if nothing needed
  # doing failed. Skipped jobs are fine.
  ci-ok:
    if: always()
    needs: [changes, lint-python, test-python, test-web, eval]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" \
                   "${{ needs.lint-python.result }}" \
                   "${{ needs.test-python.result }}" \
                   "${{ needs.test-web.result }}" \
                   "${{ needs.eval.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not pass: $r"
              exit 1
            fi
          done
          echo "CI OK"
