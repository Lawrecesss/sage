name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mcp: 'mcp/**'
            openclaw: 'openclaw/**'
            generator: 'data/generator/**'
            warehouse: 'data/warehouse/**'
            detectors: 'data/detectors/**'
            evals: 'data/evals/**'
            notifier: 'platform/notifier/**'
            web: 'web/**'
            compose: 'docker-compose.yml'

  compose-validate:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'compose')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  python:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), matrix.service)
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mcp
            path: mcp
            package: sage_mcp
          - service: generator
            path: data/generator
            package: sage_generator
          - service: warehouse
            path: data/warehouse
            package: sage_warehouse
          - service: detectors
            path: data/detectors
            package: sage_detectors
          - service: evals
            path: data/evals
            package: sage_evals
          - service: notifier
            path: platform/notifier
            package: sage_notifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --frozen

      - name: Lint
        working-directory: ${{ matrix.path }}
        run: uv run ruff check .

      - name: Import check
        working-directory: ${{ matrix.path }}
        run: uv run python -c "import ${{ matrix.package }}"

      - name: Test
        working-directory: ${{ matrix.path }}
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "no tests yet"
          fi

      - name: Docker build
        run: docker build -t sage-${{ matrix.service }} ${{ matrix.path }}

  node:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), matrix.service)
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            path: web
          - service: openclaw
            path: openclaw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: matrix.service == 'web'
        working-directory: ${{ matrix.path }}
        run: pnpm build

      - name: Docker build
        run: docker build -t sage-${{ matrix.service }} ${{ matrix.path }}
