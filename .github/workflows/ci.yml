name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      python: ${{ steps.matrix.outputs.python }}
      node: ${{ steps.matrix.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mcp: 'mcp/**'
            openclaw: 'openclaw/**'
            models: 'data/models/**'
            simulator:
              - 'data/simulator/**'
              - 'data/models/**'
            notifier: 'platform/notifier/**'
            web: 'web/**'
            compose: 'docker-compose.yml'

      # `matrix` isn't available in a job-level `if`, so filter the service
      # lists here and hand each job a matrix of only the changed services.
      - name: Build matrices of changed services
        id: matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          python='[
            {"service":"mcp","path":"mcp","package":"sage_mcp","context":"mcp","dockerfile":"mcp/Dockerfile"},
            {"service":"models","path":"data/models","package":"sage_models","context":"","dockerfile":""},
            {"service":"simulator","path":"data/simulator","package":"sage_simulator","context":"data","dockerfile":"data/simulator/Dockerfile"},
            {"service":"notifier","path":"platform/notifier","package":"sage_notifier","context":"platform/notifier","dockerfile":"platform/notifier/Dockerfile"}
          ]'
          node='[
            {"service":"web","path":"web"},
            {"service":"openclaw","path":"openclaw"}
          ]'
          pick() { jq -c --argjson changed "$CHANGES" '[.[] | select(.service as $s | $changed | index($s))]' <<<"$1"; }
          echo "python=$(pick "$python")" >> "$GITHUB_OUTPUT"
          echo "node=$(pick "$node")" >> "$GITHUB_OUTPUT"

  compose-validate:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'compose')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  python:
    needs: changes
    if: needs.changes.outputs.python != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.python) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --frozen

      - name: Lint
        working-directory: ${{ matrix.path }}
        run: uv run ruff check .

      - name: Import check
        working-directory: ${{ matrix.path }}
        run: uv run python -c "import ${{ matrix.package }}"

      - name: Test
        working-directory: ${{ matrix.path }}
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "no tests yet"
          fi

      - name: Docker build
        if: matrix.dockerfile != ''
        run: docker build -t sage-${{ matrix.service }} -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  node:
    needs: changes
    if: needs.changes.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.node) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: matrix.service == 'web'
        working-directory: ${{ matrix.path }}
        run: pnpm build

      - name: Docker build
        run: docker build -t sage-${{ matrix.service }} ${{ matrix.path }}

  # Single required status check for branch protection. Skipped jobs (no
  # changes in their paths) count as passing; failed or cancelled ones don't.
  ci-ok:
    if: always()
    needs: [changes, compose-validate, python, node]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          test "$FAILED" = "false"
