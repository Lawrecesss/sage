# Auto-label PRs by the files they touch. Consumed by .github/workflows/labeler.yml
# (actions/labeler@v5). .github/workflows/ci.yml reads the resulting labels
# straight off the PR to decide which tests to run — if you add or rename a
# label here, update the mapping in that workflow's `changes` job too.

"data/metrics":
  - changed-files:
      - any-glob-to-any-file:
          - "data/warehouse/**"
          - "data/generator/**"
          - "docs/metrics-catalog.md"
          - "docs/incident-library.md"
          - "docs/eval-plan.md"

detectors:
  - changed-files:
      - any-glob-to-any-file:
          - "data/detectors/**"

agent:
  - changed-files:
      - any-glob-to-any-file:
          - "agent/mcp/**"
          - "agent/openclaw/**"
          - "agent/evals/**"
          - "docs/contracts/**"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/**"

notifier:
  - changed-files:
      - any-glob-to-any-file:
          - "platform/notifier/**"

shared:
  - changed-files:
      - any-glob-to-any-file:
          - "agent/shared/**"

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "platform/infra/**"
          - "Dockerfile"
          - ".dockerignore"
          - "docker-compose*.yml"
          - ".github/workflows/deploy.yml"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".pre-commit-config.yaml"
          - "Makefile"
          - "scripts/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

deps:
  - changed-files:
      - any-glob-to-any-file:
          - "uv.lock"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "**/pyproject.toml"
          - "**/package.json"
          - ".nvmrc"
          - ".python-version"
