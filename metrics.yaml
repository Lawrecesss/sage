# metrics.yaml
#
# Derived from the REAL Postgres schema (data/simulator/src/sage_simulator/db/schema.py)
# and the generator logic that populates it (simulate/sales.py, simulate/accounting.py),
# not from an external spec. Every `sql:` below only references tables/columns that
# actually exist and are actually populated — verified by reading the generator code,
# not assumed from column names.
#
# metrics1.yaml (the original, externally-sourced file) stays as-is for reference —
# it names several metrics (delivery_attach_rate, reorder_point_breach_count,
# damage_shrinkage_rate, operating_expense, inventory_turnover) that have NO backing
# data in the current schema at all. See the bottom of this file for why each was
# dropped and what schema/generator work would be needed to add it back.
#
# Two schema facts that shape almost every query here:
#   - `is_refund` on fact_order_line marks a sale line that was LATER refunded; it is
#     not a separate negative-amount row. line_total_sgd is always positive.
#   - fact_stock_movement is an event log (one row per sale/receipt), not a point-in-time
#     snapshot — "current stock" means the most recent `on_hand_after` per SKU, found
#     with DISTINCT ON, not a plain SELECT.
#
# `joins`: SQL join fragments needed ONLY when a listed dimension that isn't a native
# column on the base table is requested (e.g. `category` lives on dim_sku, not
# fact_order_line). `period_column`: which date column {filters} should filter on for
# period/grain — several tables have multiple dates (date vs due_date vs paid_date)
# that mean different things, so this isn't always the obvious one.
#
# direction: higher_is_better | lower_is_better | context_dependent
# benchmark: rough "typical for this vertical" range, for agent judgement only.
#
# Every `sql:` aliases its computed column `AS value` — query_metric()'s callers get a
# consistent `value` key regardless of the underlying expression, instead of Postgres's
# default (unaliased aggregates come back named "sum"/"avg"/etc, or "?column?" for an
# expression), plus whatever GROUP BY columns a metric breaks down by.

# ── SALES ────────────────────────────────────────────────────────────────

- id: gross_revenue
  label: Gross Revenue
  description: >
    Total sale value across all order lines, including lines later refunded
    (line_total_sgd is always positive; is_refund doesn't zero it out). The
    top-line "how much did we sell" number before returns are excluded.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(line_total_sgd) AS value FROM fact_order_line WHERE {filters}
  grain: [day, week, month]
  dimensions: [channel, sku, category]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: SGD
  direction: higher_is_better
  detectors: [zscore_7d, wow_change]
  owner_domain: sales

- id: net_revenue
  label: Net Revenue
  description: >
    Revenue from lines that were NOT later refunded. What actually lands as
    sales — use this, not gross_revenue, for any margin calculation.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(line_total_sgd) AS value FROM fact_order_line WHERE NOT is_refund AND {filters}
  grain: [day, week, month]
  dimensions: [channel, sku, category]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: SGD
  direction: higher_is_better
  detectors: [zscore_7d, wow_change]
  owner_domain: sales

- id: average_order_value
  label: Average Order Value (AOV)
  description: >
    Net revenue divided by distinct orders. Furniture/homeware AOV runs high
    because purchases are infrequent but large — a sudden drop often means a
    mix shift toward small accessory items, not fewer big-ticket sales.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(line_total_sgd) / NULLIF(COUNT(DISTINCT order_id), 0) AS value FROM fact_order_line WHERE NOT is_refund AND {filters}
  grain: [day, week, month]
  dimensions: [channel]
  unit: SGD
  direction: context_dependent
  benchmark: "SGD 150-400 for furniture/homeware; well below this suggests accessory-only baskets"
  detectors: [zscore_7d, wow_change]
  owner_domain: sales

- id: units_sold
  label: Units Sold
  description: >
    Total item quantity sold, independent of price — spots volume moves that
    revenue alone can mask (e.g. a markdown driving units up, revenue flat).
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(qty) AS value FROM fact_order_line WHERE NOT is_refund AND {filters}
  grain: [day, week, month]
  dimensions: [channel, sku, category]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: units
  direction: higher_is_better
  detectors: [zscore_7d, wow_change]
  owner_domain: sales

- id: channel_mix_share
  label: Channel Mix Share
  description: >
    Each channel's share of net revenue. A large swing (e.g. store share
    collapsing) usually signals an operational problem at that channel
    specifically, not a change in overall demand.
  base_table: fact_order_line
  period_column: date
  sql: SELECT channel, SUM(line_total_sgd) / SUM(SUM(line_total_sgd)) OVER () AS value FROM fact_order_line WHERE NOT is_refund AND {filters} GROUP BY channel
  grain: [day, week, month]
  dimensions: [channel]
  unit: percent
  direction: context_dependent
  detectors: [wow_change]
  owner_domain: sales

- id: category_revenue
  label: Revenue by Category
  description: >
    Net revenue broken down by product category. The primary lens for
    "which part of the catalog is driving or dragging performance."
  base_table: fact_order_line
  period_column: date
  sql: SELECT dim_sku.category, SUM(fact_order_line.line_total_sgd) AS value FROM fact_order_line JOIN dim_sku ON fact_order_line.sku = dim_sku.sku WHERE NOT fact_order_line.is_refund AND {filters} GROUP BY dim_sku.category
  grain: [day, week, month]
  dimensions: [category, channel]
  unit: SGD
  direction: higher_is_better
  detectors: [zscore_7d, wow_change]
  owner_domain: sales

- id: return_rate
  label: Return Rate
  description: >
    Refunded units as a share of units sold. Furniture returns are costly
    (bulky reverse logistics), so this is watched tightly.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(CASE WHEN is_refund THEN qty ELSE 0 END)::float / NULLIF(SUM(qty), 0) AS value FROM fact_order_line WHERE {filters}
  grain: [week, month]
  dimensions: [category, sku, channel]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: percent
  direction: lower_is_better
  benchmark: "3-8% typical for furniture/homeware; spikes usually trace to a specific SKU quality issue"
  detectors: [zscore_7d, threshold_breach]
  owner_domain: sales

- id: discount_impact
  label: Discount Impact
  description: >
    Revenue given up to discounting: (list price - actual unit price) x qty,
    summed. Needs dim_sku for list_price_sgd since fact_order_line only
    stores the price actually charged. Pairs with units_sold to catch a
    discount that killed margin without lifting volume.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM((dim_sku.list_price_sgd - fact_order_line.unit_price_sgd) * fact_order_line.qty) AS value FROM fact_order_line JOIN dim_sku ON fact_order_line.sku = dim_sku.sku WHERE NOT fact_order_line.is_refund AND {filters}
  grain: [week, month]
  dimensions: [category, channel]
  unit: SGD
  direction: lower_is_better
  detectors: [wow_change]
  owner_domain: sales

# ── INVENTORY ────────────────────────────────────────────────────────────

- id: stock_on_hand
  label: Stock on Hand
  description: >
    Current inventory per SKU. fact_stock_movement is an event log, so
    "current" means the most recent on_hand_after row per SKU, not a plain
    column read.
  base_table: fact_stock_movement
  period_column: date
  sql: SELECT DISTINCT ON (sku) sku, on_hand_after AS value FROM fact_stock_movement WHERE {filters} ORDER BY sku, date DESC, movement_id DESC
  grain: [day]
  dimensions: [sku, category]
  joins:
    category: JOIN dim_sku ON fact_stock_movement.sku = dim_sku.sku
  unit: units
  direction: context_dependent
  detectors: [threshold_breach]
  owner_domain: inventory

- id: stockout_rate
  label: Stockout Rate
  description: >
    Share of SKUs currently at zero stock. The most important inventory
    metric here — a stockout on a popular flat-pack item can silently erase
    a category's revenue for days before a manual review would catch it.
  base_table: fact_stock_movement
  period_column: date
  sql: |
    WITH latest AS (
      SELECT DISTINCT ON (sku) sku, on_hand_after
      FROM fact_stock_movement WHERE {filters}
      ORDER BY sku, date DESC, movement_id DESC
    )
    SELECT COUNT(*) FILTER (WHERE on_hand_after = 0)::float / NULLIF(COUNT(*), 0) AS value FROM latest
  grain: [day, week]
  dimensions: [category]
  joins:
    category: JOIN dim_sku ON fact_stock_movement.sku = dim_sku.sku
  unit: percent
  direction: lower_is_better
  detectors: [threshold_breach, zscore_7d]
  owner_domain: inventory

- id: days_of_supply
  label: Days of Supply
  description: >
    Current stock divided by average daily sales velocity over the trailing
    30 days — "how many days until this SKU runs out at the current rate."
    Low values combined with a long supplier_lead_time_days are the setup
    for a stockout before a reorder can land.
  base_table: fact_stock_movement
  period_column: date
  sql: |
    WITH latest AS (
      SELECT DISTINCT ON (sku) sku, on_hand_after
      FROM fact_stock_movement WHERE {filters}
      ORDER BY sku, date DESC, movement_id DESC
    ),
    velocity AS (
      SELECT sku, SUM(qty)::float / 30 AS avg_daily_units
      FROM fact_order_line
      WHERE NOT is_refund AND date >= CURRENT_DATE - INTERVAL '30 days'
      GROUP BY sku
    )
    SELECT latest.sku, latest.on_hand_after / NULLIF(velocity.avg_daily_units, 0) AS value
    FROM latest JOIN velocity ON latest.sku = velocity.sku
  grain: [day]
  dimensions: [sku, category]
  joins:
    category: JOIN dim_sku ON latest.sku = dim_sku.sku
  unit: days
  direction: higher_is_better
  benchmark: "10-30 days typical; below the supplier lead time is a reorder-urgency signal"
  detectors: [threshold_breach]
  owner_domain: inventory

- id: dead_stock_value
  label: Dead Stock Value
  description: >
    Value of on-hand stock for SKUs with no sale in the last 90 days. Ties
    up warehouse space and working capital — the opposite failure mode from
    stockout_rate: too much of the wrong stock instead of too little of the
    right stock.
  base_table: fact_stock_movement
  period_column: date
  sql: |
    WITH latest AS (
      SELECT DISTINCT ON (sku) sku, on_hand_after, date AS as_of_date
      FROM fact_stock_movement WHERE {filters}
      ORDER BY sku, date DESC, movement_id DESC
    ),
    last_sale AS (
      SELECT sku, MAX(date) AS last_sale_date
      FROM fact_stock_movement
      WHERE movement_type = 'sale'
      GROUP BY sku
    )
    SELECT SUM(latest.on_hand_after * dim_sku.unit_cost_sgd) AS value
    FROM latest
    JOIN dim_sku ON latest.sku = dim_sku.sku
    LEFT JOIN last_sale ON latest.sku = last_sale.sku
    WHERE last_sale.last_sale_date IS NULL OR latest.as_of_date - last_sale.last_sale_date > 90
  grain: [week, month]
  dimensions: [category, sku]
  joins:
    category: JOIN dim_sku ON latest.sku = dim_sku.sku
  unit: SGD
  direction: lower_is_better
  detectors: [wow_change]
  owner_domain: inventory

- id: supplier_lead_time_days
  label: Supplier Lead Time
  description: >
    Days between placing a PO and stock arriving, by supplier. The upstream
    trigger for most stockout incidents.
  base_table: fact_purchase_order
  period_column: ordered_date
  sql: SELECT AVG(received_date - ordered_date) AS value FROM fact_purchase_order WHERE {filters}
  grain: [week, month]
  dimensions: [supplier, category]
  joins:
    category: JOIN dim_sku ON fact_purchase_order.sku = dim_sku.sku
  unit: days
  direction: lower_is_better
  detectors: [zscore_7d, wow_change]
  owner_domain: inventory

- id: purchase_order_delay
  label: Purchase Order Delay
  description: >
    Actual delivery date minus the originally expected date, for POs already
    received. A more direct early-warning signal than lead time alone —
    flags a specific PO running late right now.
  base_table: fact_purchase_order
  period_column: ordered_date
  sql: SELECT AVG(received_date - expected_date) AS value FROM fact_purchase_order WHERE {filters}
  grain: [day, week]
  dimensions: [supplier, sku]
  unit: days
  direction: lower_is_better
  detectors: [threshold_breach]
  owner_domain: inventory

# ── ACCOUNTING ───────────────────────────────────────────────────────────

- id: cogs
  label: Cost of Goods Sold
  description: >
    Direct cost of inventory sold (qty x unit_cost_sgd at time of sale). The
    main input, alongside net_revenue, for every margin metric below.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(qty * unit_cost_sgd) AS value FROM fact_order_line WHERE NOT is_refund AND {filters}
  grain: [day, week, month]
  dimensions: [category, channel]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: SGD
  direction: lower_is_better
  detectors: [zscore_7d, wow_change]
  owner_domain: accounting

- id: gross_margin_pct
  label: Gross Margin %
  description: >
    (Net revenue - COGS) / net revenue. Turns "we sold more" into "we made
    more" — a revenue increase driven by discounting can still shrink this.
  base_table: fact_order_line
  period_column: date
  sql: SELECT (SUM(line_total_sgd) - SUM(qty * unit_cost_sgd)) / NULLIF(SUM(line_total_sgd), 0) AS value FROM fact_order_line WHERE NOT is_refund AND {filters}
  grain: [week, month]
  dimensions: [category, channel]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: percent
  direction: higher_is_better
  benchmark: "30-45% typical for furniture/homeware retail"
  detectors: [zscore_7d, wow_change]
  owner_domain: accounting

- id: cogs_ratio
  label: COGS as % of Revenue
  description: >
    COGS divided by net revenue. A creeping ratio (rising unit costs from a
    supplier) can erode margin even while gross_margin_pct still looks fine
    in aggregate.
  base_table: fact_order_line
  period_column: date
  sql: SELECT SUM(qty * unit_cost_sgd) / NULLIF(SUM(line_total_sgd), 0) AS value FROM fact_order_line WHERE NOT is_refund AND {filters}
  grain: [week, month]
  dimensions: [category, supplier]
  joins:
    category: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
    # Filtering only needs supplier_id, which dim_sku already carries — no need to
    # also join dim_supplier unless a query wants the supplier's name/country too.
    supplier: JOIN dim_sku ON fact_order_line.sku = dim_sku.sku
  unit: percent
  direction: lower_is_better
  detectors: [wow_change]
  owner_domain: accounting

- id: ar_ageing
  label: Accounts Receivable Ageing
  description: >
    Unpaid customer invoices bucketed by how overdue they are, computed from
    due_date since there's no stored ageing_bucket column. Only relevant for
    credit-paying segments (see dim_customer_segment.pays_on_credit) — most
    consumer orders settle at checkout and never generate an invoice row.
  base_table: fact_invoice
  period_column: due_date
  sql: |
    SELECT
      CASE
        WHEN CURRENT_DATE - due_date <= 30 THEN '0-30'
        WHEN CURRENT_DATE - due_date <= 60 THEN '31-60'
        WHEN CURRENT_DATE - due_date <= 90 THEN '61-90'
        ELSE '90+'
      END AS ageing_bucket,
      SUM(amount_sgd) AS value
    FROM fact_invoice
    WHERE status != 'paid' AND {filters}
    GROUP BY 1
  grain: [week, month]
  dimensions: []
  unit: SGD
  direction: lower_is_better
  detectors: [threshold_breach]
  owner_domain: accounting

- id: ap_ageing
  label: Accounts Payable Ageing
  description: >
    Unpaid supplier bills bucketed by how overdue they are, same derivation
    as ar_ageing but from fact_bill.
  base_table: fact_bill
  period_column: due_date
  sql: |
    SELECT
      CASE
        WHEN CURRENT_DATE - due_date <= 30 THEN '0-30'
        WHEN CURRENT_DATE - due_date <= 60 THEN '31-60'
        WHEN CURRENT_DATE - due_date <= 90 THEN '61-90'
        ELSE '90+'
      END AS ageing_bucket,
      SUM(amount_sgd) AS value
    FROM fact_bill
    WHERE status != 'paid' AND {filters}
    GROUP BY 1
  grain: [week, month]
  dimensions: [supplier]
  unit: SGD
  direction: context_dependent
  detectors: [threshold_breach]
  owner_domain: accounting

- id: net_cashflow
  label: Net Cash Flow
  description: >
    Cash actually collected (paid invoices) minus cash actually paid out
    (paid bills) in the period, keyed on paid_date, not the invoice/bill
    issue date — this is when money moved, not when it was billed.
  base_table: fact_invoice
  period_column: paid_date
  sql: |
    WITH cash_in AS (
      SELECT COALESCE(SUM(amount_sgd), 0) AS total FROM fact_invoice WHERE status = 'paid' AND {filters}
    ),
    cash_out AS (
      SELECT COALESCE(SUM(amount_sgd), 0) AS total FROM fact_bill WHERE status = 'paid' AND {filters}
    )
    SELECT cash_in.total - cash_out.total AS value FROM cash_in, cash_out
  grain: [week, month]
  dimensions: []
  unit: SGD
  direction: higher_is_better
  detectors: [wow_change]
  owner_domain: accounting

# ── DROPPED FROM metrics1.yaml — no backing data in the current schema ────
#
# delivery_attach_rate    — no delivery/assembly add-on flag anywhere (fact_order_line
#                            has no such column, and it isn't tracked in the generator).
# reorder_point_breach_count — reorder_point IS computed by the generator
#                            (simulate/inventory.py, per-SKU, from supplier lead time),
#                            but only to decide when to place a PO — it's never written
#                            to any table, so it can't be read back for this metric.
# damage_shrinkage_rate   — fact_stock_movement.movement_type is only "sale" | "receipt";
#                            no "damaged"/"shrinkage" movement type exists.
# operating_expense       — fact_bill only models supplier POs (COGS-related); there's
#                            no rent/staff/utilities/marketing expense table at all.
# inventory_turnover      — needs a period-average inventory VALUE tracked over time;
#                            fact_stock_movement only gives point-in-time snapshots via
#                            on_hand_after, not a clean average-inventory-value series.
#
# Adding any of these back requires: a new/extended table in db/schema.py, the
# generator (simulate/*.py) actually producing values for it, and db/writer.py
# inserting them — the same three-layer change described when this split was first
# proposed. Once that's done, fold the finished metric definition back in here (or
# back into metrics1.yaml, if the goal becomes one canonical file again).
