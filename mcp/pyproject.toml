[project]
name = "retail-mcp"
version = "0.0.0"
description = "MCP server for the retail module — tenant-scoped, schema-agnostic tools served to OpenClaw"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.12",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.scripts]
retail-mcp = "retail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_mcp"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
