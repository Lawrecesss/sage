[project]
name = "sage-simulator"
version = "0.0.0"
description = "Synthetic SME dataset + planted incident library — seeds sage_models entities"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "sage-models",
]

[project.scripts]
sage-simulate = "sage_simulator.cli:app"

[tool.uv.sources]
sage-models = { path = "../models" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_simulator"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]
