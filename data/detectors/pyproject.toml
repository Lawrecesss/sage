[project]
name = "sage-detectors"
version = "0.0.0"
description = "Deterministic anomaly detection — no LLM"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sage-warehouse",
  "numpy>=2.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "polars>=1.0",
]

[project.scripts]
sage-detectors = "sage_detectors.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_detectors"]
