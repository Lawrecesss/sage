[project]
name = "sage-generator"
version = "0.0.0"
description = "Synthetic SME dataset + planted incident library — entity models"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_generator"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]
