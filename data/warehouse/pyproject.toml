[project]
name = "sage-warehouse"
version = "0.0.0"
description = "Star schema, SQL transforms and the governed metric layer"
requires-python = ">=3.12"
dependencies = [
  "sage-shared",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "polars>=1.0",
  "duckdb>=1.0",
]

[project.scripts]
sage-warehouse = "sage_warehouse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_warehouse"]
