[project]
name = "sage-warehouse"
version = "0.0.0"
description = "Star schema, SQL transforms and the governed metric layer"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "polars>=1.0",
  "duckdb>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_warehouse"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]
