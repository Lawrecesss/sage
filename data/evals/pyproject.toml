[project]
name = "sage-evals"
version = "0.0.0"
description = "Agent eval harness — replays the pipeline and prints the headline number"
requires-python = ">=3.12"
dependencies = [
  "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_evals"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]
