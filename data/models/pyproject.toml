[project]
name = "sage-models"
version = "0.0.0"
description = "Shared entity shapes (Supplier, Sku, CustomerSegment) — the domain vocabulary every service mirrors"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[project.scripts]
sage-models-export = "sage_models.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage_models"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]
