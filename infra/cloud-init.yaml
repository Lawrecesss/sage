#cloud-config
# Lightsail instance user-data. Paste into the "Launch script" box when creating the
# instance, or pass via `aws lightsail create-instances --user-data file://...`.
#
# After boot: SSH in, put real secrets in /opt/sage/.env, then
#   cd /opt/sage && sudo docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d --build

package_update: true
packages:
  - ca-certificates
  - curl
  - git

runcmd:
  # --- Docker Engine + compose plugin ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  # --- App ---
  - git clone https://github.com/Lawrecesss/sage /opt/sage
  - test -f /opt/sage/.env || cp /opt/sage/.env.example /opt/sage/.env
  - |
    cat >> /opt/sage/.env <<'EOF'

    # --- filled on the instance ---
    POSTGRES_PASSWORD=change-me
    SAGE_DOMAIN=sage.example.com
    LLM_BASE_URL=
    LLM_API_KEY=
    LLM_MODEL=claude-sonnet-4-5
    TELEGRAM_BOT_TOKEN=
    TELEGRAM_CHAT_ID=
    EOF

  # --- Daily briefing cron (06:00 instance time) ---
  - echo '0 6 * * * root curl -fsS -XPOST http://localhost/api/brief/run >> /var/log/sage-cron.log 2>&1' > /etc/cron.d/sage-briefing

  # NOTE: bring the stack up manually after editing /opt/sage/.env:
  #   cd /opt/sage && docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
